<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Gestión de Productos</h1>
    <p class="sub">Página → Backend (Express) → PostgreSQL → respuesta en la página</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-titulo">Crear producto</h2>
      <form id="form-producto">
        <input type="hidden" id="producto-id" />
        <label>Nombre
          <input type="text" id="nombre" maxlength="100" required />
        </label>
        <label>Precio
          <input type="number" id="precio" min="0" step="0.01" required />
        </label>
        <label>Stock
          <input type="number" id="stock" min="0" step="1" required />
        </label>
        <div class="acciones">
          <button type="submit" id="btn-guardar">Crear</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Buscar y consultar</h2>
      <form id="form-buscar" class="fila">
        <input type="text" id="buscar-nombre" placeholder="Buscar por nombre..." />
        <button type="submit">Buscar</button>
        <button type="button" id="btn-todos" class="secundario">Ver todos</button>
      </form>
      <form id="form-id" class="fila">
        <input type="number" id="buscar-id" min="1" placeholder="Consultar por id..." />
        <button type="submit">Consultar</button>
      </form>
    </section>

    <div id="mensaje" role="status" hidden></div>

    <section class="card">
      <h2>Productos</h2>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Creado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos">
            <tr><td colspan="6" class="vacio">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
